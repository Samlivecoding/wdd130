<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Exciting Expeditions Whitewater Rafting</title>
    <meta name="description" content="Contact Exciting Expeditions to ask about whitewater rafting trips, make a reservation inquiry, or send a suggestion. Find our address, phone, and map.">
    <meta name="author" content="Samuel Okechukwu Joseph">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-excitingexpedition.jpg" alt="Exciting Expeditions logo" class="logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>White Water Rafting Company</h1>

        <address class="contact-info">
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p><a href="tel:+19999999999">+1 999 999 9999</a></p>
            <p><a href="mailto:info@whitewater.com">info@whitewater.com</a></p>
        </address>

        <section class="contact-section">
            <iframe class="map" title="Map showing the location of Exciting Expeditions" src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d6723.7079927775385!2d33.16416107145278!3d0.4809815710122278!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1795630879267!5m2!1sen!2sng" width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

            <form action="#" method="post" class="contact-form">
                <div class="field">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Placeholder" required>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Placeholder" required>
                </div>

                <fieldset>
                    <legend>Message Purpose</legend>
                    <label><input type="radio" id="purpose-general" name="purpose" value="general" checked> General Inquiry</label>
                    <label><input type="radio" id="purpose-reservation" name="purpose" value="reservation"> Reservation Question</label>
                    <label><input type="radio" id="purpose-suggestion" name="purpose" value="suggestion"> Website Suggestion</label>
                </fieldset>

                <div class="field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="Type here" required></textarea>
                </div>

                <label class="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter" checked>
                    Please Subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>
            </form>
        </section>

        <section class="serve">
            <h2>We Are Here to Serve You</h2>
            <div class="employees">
                <figure>
                    <img src="images/employee.jpg" alt="Employee profile photo 1">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employee.jpg" alt="Employee profile photo 2">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employee.jpg" alt="Employee profile photo 3">
                    <figcaption>Employee Profile</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 &#128166; Exciting Expeditions &#128166; Samuel Okechukwu Joseph</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/"><img src="images/facebook-square.svg" alt="Facebook"></a>
            <a href="https://www.linkedin.com/"><img src="images/linkedin.svg" alt="Linkedin"></a>
            <a href="https://www.instagram.com/"><img src="images/instagram.svg" alt="Instagram"></a>
        </nav>
    </footer>

</body>

</html>
